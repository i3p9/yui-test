version: "3.8"

services:
  yui:
    build: .
    container_name: yui
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # Configuration directory (persisted, writable)
      - ./config:/config

      # Database (persisted)
      - ./data:/data

      # Generated thumbnails (persisted)
      # Matches thumbnailDir in config.json
      - ./thumbnails:/app/.thumbnails

      # Fetched metadata (persisted)
      # Matches metadataDir in config.json
      - ./metadata:/app/.metadata

      # Video libraries (read-only - UPDATE THESE PATHS!)
      # Map your actual video library paths to /media inside the container
      # Then update config.json libraries to point to /media/...
      # Example:
      # - /Users/fahim/Downloads/downloads:/media:ro
      - /mnt/big/media/youtube:/media:ro
      # - /path/to/more/videos:/media2:ro

    environment:
      - NODE_ENV=production
      - CONFIG_PATH=/config/config.json
      - DATABASE_URL=file:/data/yui.db
      # Optional: Increase Node.js memory if scanning large libraries
      # - NODE_OPTIONS=--max-old-space-size=4096

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
